spring.application.name=e-learning

# 1. MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/elearning_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Hibernate/JPA
spring.jpa.properties.hibernate.format_sql=true

# 3. Cấu hình Swagger UI (để xem tài liệu API)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# 4. Cấu hình Redis Caching
spring.cache.type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

# 5. Cấu hình VNPay (Sandbox)
vnpay.tmnCode=YOUR_TMN_CODE
vnpay.hashSecret=YOUR_HASH_SECRET
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=http://localhost:8080/api/payment/vnpay-return

# 6. Cấu hình RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# 4. Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dsypmso4t}
cloudinary.api-key=${CLOUDINARY_API_KEY:257976411884745}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:0Dkm0yfiYEsMcMlUjytl30zMQ2A}

# 5. Upload file size
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
