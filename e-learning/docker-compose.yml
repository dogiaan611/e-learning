version: '3.8'

services:
  elearning-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/elearning_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_DATA_REDIS_HOST=redis-cache
      - SPRING_RABBITMQ_HOST=rabbitmq-server
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      rabbitmq-server:
        condition: service_started
    networks:
      - elearning-network

  mysql-db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=elearning_db
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - elearning-network

  redis-cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - elearning-network

  rabbitmq-server:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    networks:
      - elearning-network

networks:
  elearning-network:
    driver: bridge
